<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- 主题必须在首次绘制前定下来，所以放在 head 里同步跑，见 theme.js -->
  <script src="theme.js"></script>
  <title>BiliSpeed</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- 收起按钮只在“被页面悬浮按钮以内嵌面板打开”时出现，浮在面板右上角；
       经由 popup.js 控制，所以浏览器工具栏弹窗里不会显示 -->
  <button id="closeBtn" class="close" type="button" aria-label="收起面板" title="收起" hidden>×</button>

  <!-- 设置按钮：贴在收起按钮正下方、同尺寸的圆形图标键。
       它两个入口（工具栏弹窗 / 页面悬浮面板）都显示，点了切到设置界面，
       由 popup.js 控制 -->
  <button id="settingsBtn" class="settings" type="button" aria-label="设置" title="设置">⚙</button>

  <main class="card" id="mainView">
    <!-- 当前速度：数字大号显示，右上角是快捷微调 -->
    <div class="readout">
      <output id="rateText" class="rate" for="rateSlider"><span id="rateValue">1.00</span><span class="rate-unit">x</span></output>
      <div class="stepper">
        <button id="minusBtn" class="step" type="button" aria-label="减慢 0.25 倍速">−</button>
        <button id="plusBtn" class="step" type="button" aria-label="加快 0.25 倍速">+</button>
      </div>
    </div>

    <input
      id="rateSlider"
      class="slider"
      type="range"
      min="0.25"
      max="16"
      step="0.25"
      value="1"
      aria-label="播放速度" />

    <div class="scale" aria-hidden="true">
      <span>0.25x</span><span>4x</span><span>8x</span><span>16x</span>
    </div>

    <!-- 常用档位 -->
    <div class="presets">
      <button class="preset" type="button" data-rate="0.5">0.5x</button>
      <button class="preset" type="button" data-rate="1">1x</button>
      <button class="preset" type="button" data-rate="1.5">1.5x</button>
      <button class="preset" type="button" data-rate="2">2x</button>
      <button class="preset" type="button" data-rate="3">3x</button>
      <button class="preset" type="button" data-rate="4">4x</button>
      <button class="preset" type="button" data-rate="8">8x</button>
      <button class="preset" type="button" data-rate="16">16x</button>
    </div>

    <button id="resetBtn" class="reset" type="button">重置为 1x</button>
  </main>

  <!-- 设置界面：与倍速主界面互斥显示（靠 popup.js 切 hidden），
       右上角的「退出」回到倍速主界面 -->
  <main class="card" id="settingsView" hidden>
    <div class="settings-top">
      <h1 class="settings-title">设置</h1>
      <button id="settingsExitBtn" class="exit" type="button">退出</button>
    </div>

    <!-- 外观：关 = 现在这份浅色，开 = 暗色模式 -->
    <div class="setting-row">
      <label class="setting-name" for="darkModeToggle">暗色模式</label>
      <input id="darkModeToggle" class="switch" type="checkbox" />
    </div>

    <!-- 最下面：进入关于界面 -->
    <button id="aboutBtn" class="nav-row" type="button">
      <span>关于</span>
      <span class="nav-arrow" aria-hidden="true">›</span>
    </button>
  </main>

  <!-- 关于界面：第三屏，同样靠 [hidden] 与另两屏互斥。
       右上角的「返回」回到设置界面（不是回倍速界面） -->
  <main class="card" id="aboutView" hidden>
    <div class="settings-top">
      <h1 class="settings-title">关于</h1>
      <button id="aboutBackBtn" class="exit" type="button">返回</button>
    </div>

    <dl class="about-list">
      <div class="about-item">
        <dt>名称</dt>
        <dd>BiliSpeed 倍速控制</dd>
      </div>
      <div class="about-item">
        <dt>版本</dt>
        <dd id="aboutVersion">—</dd>
      </div>
      <div class="about-item">
        <dt>用途</dt>
        <dd>给 B 站视频设置播放倍速</dd>
      </div>
      <div class="about-item">
        <dt>作者</dt>
        <dd>奶油</dd>
      </div>
    </dl>

    <!-- 作者渠道：界面上只出现渠道名，真实 URL 全部放在 href 里，
         所以面板上看不到任何链接字符串。
         新标签页打开：MV3 的扩展页允许 target="_blank"；
         rel="noreferrer" 免得把扩展页地址透给对面。 -->
    <div class="about-links">
      <a class="about-link" id="authorBili" href="https://space.bilibili.com/3546584163814345"
         target="_blank" rel="noreferrer">B站</a>
      <a class="about-link" id="authorGitHub" href="https://github.com/naiyoucreamy/bilispeed"
         target="_blank" rel="noreferrer">GitHub</a>
      <a class="about-link" id="authorYouTube"
         href="https://www.youtube.com/@%E4%B8%80%E4%B8%AA%E5%B0%8F%E7%81%B0%E6%9C%BA"
         target="_blank" rel="noreferrer">YouTube</a>
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
