<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>BiliSpeed</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="head">
    <span class="logo">Bili</span><span class="logo logo-alt">Speed</span>
    <span class="head-note">仅当前标签页</span>
  </header>

  <section class="card">
    <div class="rate-row">
      <output id="rateText" class="rate">1.00x</output>
      <div class="rate-meta">
        <span id="tag" class="tag">读取中…</span>
      </div>
    </div>

    <input
      id="rateSlider"
      class="slider"
      type="range"
      min="0.25"
      max="16"
      step="0.25"
      value="1"
      aria-label="当前标签页的播放速度" />

    <div class="ticks">
      <span>0.25x</span><span>4x</span><span>8x</span><span>16x</span>
    </div>

    <!-- 快捷档位 -->
    <div class="presets">
      <button class="preset" data-rate="0.5">0.5x</button>
      <button class="preset" data-rate="1">1x</button>
      <button class="preset" data-rate="1.5">1.5x</button>
      <button class="preset" data-rate="2">2x</button>
      <button class="preset" data-rate="3">3x</button>
      <button class="preset" data-rate="4">4x</button>
      <button class="preset" data-rate="8">8x</button>
      <button class="preset" data-rate="16">16x</button>
    </div>

    <div class="actions">
      <button id="resetBtn" class="btn btn-primary">重置为 1x</button>
      <button id="minusBtn" class="btn" title="减少 0.25" aria-label="减少">−</button>
      <button id="plusBtn" class="btn" title="增加 0.25" aria-label="增加">+</button>
    </div>
  </section>

  <footer class="foot">
    <p class="tip">只作用于当前标签页；关闭标签页后速度自动清除，新标签页从 1x 开始。</p>
    <p id="status" class="status">就绪</p>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
